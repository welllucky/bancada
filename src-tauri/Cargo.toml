[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "bancada"
version = "0.4.1"
description = "Bancada — painel nativo para inspecionar e controlar celulares Android via USB"
edition = "2021"
license = "MIT"

[lib]
name = "bancada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bancada-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

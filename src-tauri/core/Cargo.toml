[package]
name = "phone-deck-core"
version = "0.1.0"
edition = "2021"
description = "ADB collectors, parsers, optimizer and history for Phone Deck"
license = "MIT"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wait-timeout = "0.2"

name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tags are covered by release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # versions pinned in mise.toml (same as local dev)
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: rust
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"
      - name: Core tests (no webview needed)
        working-directory: src-tauri
        run: cargo test -p bancada-core

  frontend:
    name: frontend build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # versions pinned in mise.toml (same as local dev)
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # only needed once private GitHub Packages deps are added; empty otherwise
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: pnpm build

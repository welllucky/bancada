name: release

# Cada push na main calcula a próxima versão pelos Conventional Commits (scripts/release-version.mjs).
# Se houver feat/fix/perf/breaking desde a última tag: testa, cria a tag vX.Y.Z, compila para Linux, macOS
# (arm64 e x64) e Windows, publica a release com as notas e o latest.json do atualizador.
# Depois de publicar, a versão volta para a main num commit `chore(release): X.Y.Z` feito pela API do GitHub
# (assinado pelo GitHub; com o GITHUB_TOKEN não dispara outro workflow, e `chore` não gera versão).
#
# Configuração no repositório (Settings › Secrets and variables › Actions):
#   vars.RELEASE_REPO       opcional, `dono/repo` público onde publicar (padrão: este repositório)
#   secrets.RELEASE_TOKEN   token com escrita em RELEASE_REPO (só quando ele for outro repositório)
#   secrets.TAURI_SIGNING_PRIVATE_KEY / _PASSWORD   assinam as atualizações; sem eles a release sai sem atualizador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        run: node scripts/release-version.mjs
      - if: steps.v.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # versions pinned in mise.toml (same as local dev)
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Core tests (no webview needed)
        working-directory: src-tauri
        run: cargo test -p bancada-core

  release:
    needs: [version, test]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
      - name: Release em rascunho
        id: r
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          args=(-f tag_name="$TAG" -f name="Bancada $TAG" -F body=@release-notes.md -F draft=true)
          # No próprio repositório a tag aponta para o commit; num repo só de releases, para o branch padrão dele.
          if [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ]; then args+=(-f target_commitish="$GITHUB_SHA"); fi
          id=$(gh api "repos/$RELEASE_REPO/releases" "${args[@]}" -q .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, test, release]
    # Roda numa release, ou manualmente só para gerar os instaladores como artefatos.
    if: always() && needs.test.result == 'success' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # rust, node and pnpm versions pinned in mise.toml (same as local dev)
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: macOS cross targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - name: Versão da release nos manifestos
        if: needs.release.result == 'success'
        shell: bash
        run: node scripts/release-version.mjs --set "${{ needs.version.outputs.version }}"

      - name: Atualizador (só com a chave de assinatura configurada)
        id: up
        shell: bash
        run: |
          if [ "${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}" = "true" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY ausente: release sem atualização automática."
          fi

      - name: Dono e repositório da release
        id: dest
        shell: bash
        run: |
          echo "owner=${RELEASE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${RELEASE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          owner: ${{ steps.dest.outputs.owner }}
          repo: ${{ steps.dest.outputs.repo }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.up.outputs.args }}

      - name: Upload bundles (manual runs)
        if: needs.release.result != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bancada-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: ignore

  publish:
    needs: [version, release, build]
    if: needs.release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publica a release (o atualizador só enxerga releases publicadas)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$RELEASE_REPO/releases/${{ needs.release.outputs.id }}" -F draft=false -f make_latest=true
      # Num repo só de releases, a tag daqui marca o commit que virou versão (base da próxima).
      # No próprio repositório, publicar a release já cria a tag no commit.
      - name: Tag neste repositório
        if: env.RELEASE_REPO != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Versão de volta na main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          files=(package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/core/Cargo.toml src-tauri/Cargo.lock)
          for try in 1 2 3; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            node scripts/release-version.mjs --set "$VERSION"
            if git diff --quiet; then echo "A main já está em $VERSION."; exit 0; fi
            additions=$(for f in "${files[@]}"; do jq -n --arg p "$f" --arg c "$(base64 -w0 "$f")" '{path: $p, contents: $c}'; done | jq -s .)
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg head "$(git rev-parse HEAD)" --arg msg "chore(release): $VERSION" --argjson add "$additions" '{
              query: "mutation($i: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $i) { commit { oid } } }",
              variables: { i: { branch: { repositoryNameWithOwner: $repo, branchName: "main" }, expectedHeadOid: $head,
                message: { headline: $msg }, fileChanges: { additions: $add } } }
            }' > body.json
            # Falha se a main andou entre o fetch e o commit; aí tenta de novo sobre a nova ponta.
            if gh api graphql --input body.json -q .data.createCommitOnBranch.commit.oid; then exit 0; fi
            sleep 5
          done
          echo "::warning::Não foi possível gravar a versão $VERSION na main."
